name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Debug and release both run: several bugs (see CHANGELOG, "Fixed") only
  # showed up in release builds, where debug_assert! is compiled out.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --all-features --release

  # The examples assert their own results (analytic checks, CIs, traffic
  # equations), so run them, not just compile them.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release -p tpt-des --example mm1_vs_erlang --features "std queue"
      - run: cargo run --release -p tpt-des --example markov_absorption --features "std markov"
      - run: cargo run --release -p tpt-des --example spn_reachability --features "std petri"
      - run: cargo run --release -p tpt-des --example deadlock_detection --features "std resource"
      - run: cargo run --release -p tpt-des --example process_bank_teller --features "std process"
      - run: cargo run --release -p tpt-des --example stats_replications --features "std queue stats"
      - run: cargo run --release -p tpt-des --example hybrid_bridge --features "std process"
      - run: cargo run --release -p tpt-des --example call_center_erlang --features "std queue"
      - run: cargo run --release -p tpt-des --example inventory_store --features "std resource"
      - run: cargo run --release -p tpt-des --example jackson_network --features "std queue"

  # Rustdoc with warnings as errors, so broken intra-doc links and missing
  # docs fail the build.
  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --all-features --no-deps

  # The advertised minimum supported Rust version (workspace rust-version).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.84
      - run: cargo check --workspace --all-features --all-targets

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi, wasm32-unknown-unknown
      # Only tpt-des-core is genuinely no_std-capable. The other crates
      # need std or alloc (their numerics use linalg/prob crates that
      # require them); they are documented as std-only and are not built here.
      - run: cargo build -p tpt-des-core --no-default-features --target thumbv6m-none-eabi
      - run: cargo build -p tpt-des-core --no-default-features --target wasm32-unknown-unknown
      - run: cargo build -p tpt-des-core --no-default-features
      - run: cargo build -p tpt-des --no-default-features --features core

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Kani bounded model checks. Kept as a separate, non-blocking job so a
  # Kani release lag cannot break the main gate; flip `continue-on-error`
  # off once harnesses are stable. Runs the proofs (no --only-codegen).
  kani:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v2
        with:
          args: -p tpt-des-verify
