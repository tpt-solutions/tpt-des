# cargo-deny configuration — license/security/dependency hygiene.
# Mirrors tpt-math / tpt-control policy: permissive-license allowlist, no
# unknown registry/git sources, Apache-2.0-only crates denied per ecosystem
# precedent (e.g. nalgebra, clarabel, faer, statrs).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# All workspace crates are MIT OR Apache-2.0. The allow-list also permits the
# permissive licenses of transitive dependencies pulled in by tpt-math,
# proptest, criterion, and dev/build tooling.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Every dependency must carry a version requirement; `*` would float.
wildcards = "deny"
# Apache-2.0-only numerics crates are excluded by ecosystem policy (see the
# header). Denying them here makes an accidental pull a hard failure.
deny = [
    { name = "nalgebra" },
    { name = "clarabel" },
    { name = "faer" },
    { name = "statrs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
