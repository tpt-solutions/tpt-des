[package]
name = "tpt-des-wasm"
description = "WebAssembly bindings for tpt-des: run, validate, and size a queue from JavaScript"
readme = "README.md"
keywords = ["simulation", "queueing", "wasm"]
categories = ["simulation", "wasm"]
publish = false

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-des-core = { workspace = true }
tpt-des-queue = { workspace = true, features = ["std"] }
wasm-bindgen = "0.2"

[lints]
workspace = true
